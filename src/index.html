<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard project</title>

</head>

<body>
    <div class="wrapper">
        <button id="open-button" class="hidden">&rarr;</button>
        <div id="side-panel">
            <button id="toggle-button">&#9776;</button>
            <div class="month-selector">
                <h3>Period</h3>
                <select id="month-select" class="month-select">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
                <select id="year-select" class="year-select">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <nav>
                <a href="#" id="nav-projects" class="nav-item active">Projects</a>
                <a href="#" id="nav-employees" class="nav-item">Employees</a>
            </nav>
        </div>
        <div id="main-content">
            <div id="projects-content">
                <div class="content-header">
                    <h1>Projects</h1>
                    <div>
                        <button id="add-project-btn" class="add-btn">+ Add Project</button>
                        <button id="seed-data-btn" class="add-btn" style="margin-left: 10px;">Seed Data</button>
                    </div>
                </div>
                <div id="projects-table-container">
                </div>
            </div>
            <div id="employees-content" class="hidden">
                <div class="content-header">
                    <h1>Employees</h1>
                    <button id="add-employee-btn" class="add-btn">+ Add Employee</button>
                </div>
                <div id="employees-container"></div>
                <div id="employee-filters-container" class="filters-container"></div>
                <div id="table-container">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
